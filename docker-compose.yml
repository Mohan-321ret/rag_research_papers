name: daa-rag

services:
  postgres:
    image: postgres:16-alpine
    container_name: daa-rag-postgres
    environment:
      POSTGRES_USER: daarag
      POSTGRES_PASSWORD: daarag
      # This project's own database (kept separate from any other project's).
      POSTGRES_DB: rag_research_paper
    ports:
      # Override with POSTGRES_HOST_PORT if a local PostgreSQL already uses 5432.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daarag -d rag_research_paper"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: daa-rag-neo4j
    environment:
      NEO4J_AUTH: neo4j/daarag-neo4j
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  neo4jdata:
